name: Update anime data

# 每月 1 号经 bgm 官方 API 增量更新「当年 × 全部国别」（1 月额外定稿上一年），合并进 anime-data.json 并提交。
# 抓取失败时脚本 exit 1、数据文件不动 → 本工作流标红（GitHub 会邮件通知），部署工作流也不会跟着跑。
# 也可在 Actions 页面手动触发，可选指定年份。

on:
  schedule:
    - cron: "0 0 1 * *" # 每月 1 号 00:00 UTC（北京时间 08:00）
  workflow_dispatch:
    inputs:
      year:
        description: "指定年份（逗号分隔，留空=默认月更逻辑）"
        required: false
        default: ""

permissions:
  contents: write

# 避免与上一次未完成的运行并发写仓库
concurrency:
  group: update-anime-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh data via bgm API (all regions)
        env:
          YEAR: ${{ inputs.year }}
        run: bun run data:update ${YEAR:+--year=$YEAR}

      - name: Commit & push if changed
        run: |
          if git diff --quiet -- anime-data.json; then
            echo "数据无变化，跳过提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anime-data.json
          git commit -m "chore(data): refresh $(date -u +%Y-%m)"
          git push
